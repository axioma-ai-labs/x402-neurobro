# Neurobro API Endpoints Documentation
# All endpoints require payment via x402 protocol on Base mainnet

endpoints:
  # Bull Market Indicators
  - path: /api/v1/public/bull-market-indicators
    description: Retrieve bull market indicators & market sentiment data
    price: $1.00 USDC
    network: base
    method: GET
    
  # Macro Indicators
  - path: /api/v1/public/macro-indicators
    description: Get macroeconomic indicators & trends
    price: $1.00 USDC
    network: base
    method: GET
    
  # Institutional Money Flow Transfers
  - path: /api/v1/public/transfers
    description: Fetch institutional money transfer data & transactions
    price: $1.00 USDC
    network: base
    method: GET
    
  # Health Check
  - path: /api/v1/public/health
    description: Check API health status
    price: $0.001 USDC
    network: base
    method: GET

# Base URL
base_url: https://x402.neurobro.ai

# Payment Network
network: base

# All endpoints are payable via x402 protocol
# Use x402-axios or x402-fetch packages to automatically handle payments